<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İzEvent | Organizasyon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Montserrat",sans-serif;
background:#f8f5ed;
color:#4d5349;
}

/* HEADER */

header{
background:#f9f6ef;
border-bottom:1px solid #dedacf;
position:sticky;
top:0;
z-index:100;
}

.nav{
max-width:1200px;
margin:auto;
padding:16px 25px;
display:flex;
align-items:center;
justify-content:space-between;
}

/* LOGO */

.logo{
color:#515949;
text-decoration:none;
}

.logo-main{
display:flex;
align-items:flex-end;
line-height:.8;
}

.iz{
font-family:"Cormorant Garamond",serif;
font-size:53px;
font-weight:600;
letter-spacing:-7px;
position:relative;
padding-left:15px;
}

.iz:before{
content:"";
position:absolute;
width:26px;
height:12px;
left:-10px;
top:19px;
border-top:1.5px solid #65705d;
border-radius:60%;
transform:rotate(-32deg);
}

.iz:after{
content:"";
position:absolute;
width:16px;
height:8px;
left:-2px;
top:10px;
border-top:1px solid #65705d;
border-radius:60%;
transform:rotate(20deg);
}

.event{
font-family:"Cormorant Garamond",serif;
font-size:35px;
font-weight:400;
margin-left:4px;
}

.logo-sub{
font-size:8px;
letter-spacing:5px;
margin-top:8px;
margin-left:15px;
color:#6d7467;
}

nav{
display:flex;
gap:28px;
font-size:12px;
}

nav a{
text-decoration:none;
color:#596055;
}

.quote-btn{
background:#65705e;
color:white;
padding:12px 21px;
border-radius:30px;
text-decoration:none;
font-size:11px;
}

/* HERO */

.hero{
min-height:650px;
display:flex;
align-items:center;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 78% 25%,rgba(255,255,255,.75),transparent 25%),
radial-gradient(circle at 90% 70%,rgba(160,168,145,.20),transparent 34%),
linear-gradient(120deg,#faf7f0 0%,#f5f0e7 56%,#dddccf 100%);
}

.hero:before{
content:"";
position:absolute;
width:430px;
height:430px;
border:1px solid rgba(102,112,94,.22);
border-radius:50%;
right:-80px;
top:85px;
}

.hero:after{
content:"";
position:absolute;
width:260px;
height:520px;
right:100px;
top:40px;
background:
linear-gradient(70deg,transparent 47%,rgba(103,113,94,.25) 48%,rgba(103,113,94,.25) 49%,transparent 50%),
linear-gradient(110deg,transparent 47%,rgba(103,113,94,.14) 48%,rgba(103,113,94,.14) 49%,transparent 50%);
opacity:.6;
transform:rotate(15deg);
}

.hero-inner{
max-width:1200px;
width:100%;
margin:auto;
padding:90px 45px;
position:relative;
z-index:2;
}

.line{
width:42px;
height:1px;
background:#77806d;
margin-bottom:22px;
}

.eyebrow{
font-size:10px;
letter-spacing:5px;
line-height:1.8;
color:#707768;
margin-bottom:20px;
}

h1{
font-family:"Cormorant Garamond",serif;
font-size:88px;
line-height:.9;
font-weight:500;
color:#485044;
margin-bottom:28px;
}

.hero p{
max-width:510px;
font-size:14px;
line-height:1.9;
color:#5f655b;
margin-bottom:32px;
}

.btn{
display:inline-block;
background:#667160;
color:white;
text-decoration:none;
padding:15px 27px;
font-size:10px;
letter-spacing:3px;
}

/* SERVICES */

.services{
background:#fbf8f2;
padding:90px 30px;
}

.title{
text-align:center;
margin-bottom:55px;
}

.title:before{
content:"";
display:block;
width:38px;
height:1px;
background:#858b78;
margin:0 auto 17px;
}

.title h2{
font-family:"Cormorant Garamond",serif;
font-size:52px;
font-weight:500;
color:#485044;
}

.title p{
font-size:9px;
letter-spacing:4px;
margin-top:8px;
color:#8a8e82;
}

.service-grid{
max-width:1050px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:50px;
}

.service{
text-align:center;
}

.service-mark{
height:70px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:16px;
}

.service-mark span{
display:block;
width:42px;
height:42px;
border:1px solid #7c8473;
transform:rotate(45deg);
position:relative;
}

.service:nth-child(2) .service-mark span{
border-radius:50%;
transform:none;
}

.service:nth-child(3) .service-mark span{
width:48px;
height:28px;
border-radius:50% 50% 0 50%;
transform:rotate(-20deg);
}

.service:nth-child(4) .service-mark span{
width:34px;
height:50px;
border-radius:50% 0 50% 0;
transform:rotate(35deg);
}

.service h3{
font-family:"Cormorant Garamond",serif;
font-size:24px;
font-weight:500;
margin-bottom:8px;
}

.service p{
font-size:12px;
line-height:1.7;
color:#7b7f76;
}

/* ABOUT */

.about{
display:grid;
grid-template-columns:1fr 1fr;
min-height:570px;
}

.about-visual{
background:
radial-gradient(circle at 25% 30%,rgba(255,255,255,.8),transparent 18%),
radial-gradient(circle at 65% 55%,rgba(101,112,93,.18),transparent 28%),
linear-gradient(145deg,#e5e0d4,#c8c9b9);
position:relative;
overflow:hidden;
}

.about-visual:before{
content:"";
position:absolute;
width:320px;
height:320px;
border:1px solid rgba(89,101,82,.30);
border-radius:50%;
left:70px;
top:90px;
}

.about-visual:after{
content:"";
position:absolute;
width:220px;
height:420px;
left:180px;
top:60px;
border-left:1px solid rgba(84,96,78,.3);
border-radius:50%;
transform:rotate(28deg);
}

.about-text{
padding:80px 70px;
display:flex;
flex-direction:column;
justify-content:center;
background:#f5f1e9;
}

.about-text h2{
font-family:"Cormorant Garamond",serif;
font-size:55px;
line-height:1;
font-weight:500;
color:#485044;
margin-bottom:24px;
}

.about-text p{
font-size:14px;
line-height:1.9;
color:#62675e;
margin-bottom:30px;
max-width:500px;
}

/* QUOTE */

.quote{
background:#d9ddd1;
text-align:center;
padding:55px 25px;
}

.quote p{
font-family:"Cormorant Garamond",serif;
font-size:40px;
font-style:italic;
color:#545c50;
}

/* CONTACT */

.contact{
padding:85px 25px;
background:#faf7f0;
text-align:center;
}

.contact h2{
font-family:"Cormorant Garamond",serif;
font-size:52px;
font-weight:500;
color:#485044;
}

.contact-intro{
font-size:13px;
margin:10px 0 40px;
color:#74796f;
}

.contact-grid{
max-width:850px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.contact-item{
border-top:1px solid #b5b9ab;
border-bottom:1px solid #b5b9ab;
padding:25px 10px;
}

.contact-label{

font-size:20px;
margin-bottom:8px;
color:#596154;
}
